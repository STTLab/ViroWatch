# ViroWatch main conda environment — LOCKED (fully pinned name=version=build).
#
# Regenerated from a known-good solve so it always resolves regardless of
# upstream conda repodata drift. Do NOT hand-edit individual pins. To change a
# tool: create/update the env, then re-export:
#     micromamba env export -n virowatch > envs/virowatch.yaml
#
# Includes kraken2=2.1.3=pl5321h077b44d_4 (the libzlib>=1.3.1 build that
# coexists with chopper/samtools; earlier from-scratch solves mis-picked an
# incompatible build, which is why this file is pinned).
#
# AVX2 caveat: flye is pinned to 2.9.5 (newer builds SIGILL on pre-Haswell CPUs
# such as the Xeon E5-2670 v0 test server). racon here is 1.5.0, which also
# emits AVX2; on non-AVX2 hardware replace the binary after env creation:
#     wget https://conda.anaconda.org/bioconda/linux-64/racon-1.4.20-hd03093a_2.tar.bz2
#     tar xjf racon-1.4.20-hd03093a_2.tar.bz2 -C <env-prefix> bin/racon bin/rampler
